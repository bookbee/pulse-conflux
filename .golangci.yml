version: "2"
linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - misspell
    - unused
  exclusions:
    rules:
      # Table-driven tests routinely ignore close/cleanup errors.
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
